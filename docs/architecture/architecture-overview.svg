<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" fill="none">
  <defs>
    <style>
      .title { font: 700 18px 'Segoe UI', system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 11px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .box-label { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #0f172a; }
      .box-desc { font: 400 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .badge { font: 600 9px 'Segoe UI', system-ui, sans-serif; fill: #fff; }
      .arrow-label { font: 500 10px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .section-label { font: 700 10px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; letter-spacing: 1.5px; }
      .tool-text { font: 600 11px 'Segoe UI', system-ui, sans-serif; fill: #1e40af; }
      .tool-accent { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #3730a3; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="750" rx="12" fill="url(#bg)"/>
  <rect width="960" height="750" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">NovaLens Architecture</text>
  <text x="480" y="54" text-anchor="middle" class="subtitle">AI Visual Code Review Agent  |  Serverless on AWS (9 Services)</text>

  <!-- ==================== ROW 1: CLIENT ==================== -->
  <text x="44" y="90" class="section-label">CLIENT</text>

  <!-- React SPA -->
  <rect x="290" y="74" width="380" height="52" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="290" y="74" width="380" height="4" rx="10" fill="#3b82f6"/>
  <text x="480" y="98" text-anchor="middle" class="box-label">React 19 SPA</text>
  <text x="480" y="114" text-anchor="middle" class="box-desc">Vite 6  +  Tailwind CSS 4  +  shadcn/ui  +  Zustand</text>

  <!-- Arrow: SPA -> CloudFront -->
  <line x1="480" y1="126" x2="480" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="148" class="arrow-label">HTTPS</text>

  <!-- ==================== ROW 2: EDGE ==================== -->
  <text x="44" y="182" class="section-label">EDGE</text>

  <!-- CloudFront -->
  <rect x="230" y="164" width="500" height="50" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="230" y="164" width="500" height="4" rx="10" fill="#8b5cf6"/>
  <rect x="244" y="180" width="38" height="16" rx="4" fill="#8b5cf6"/>
  <text x="263" y="191" text-anchor="middle" class="badge">CDN</text>
  <text x="480" y="192" text-anchor="middle" class="box-label">Amazon CloudFront</text>
  <text x="480" y="206" text-anchor="middle" class="box-desc">S3 Origin (Static Assets)  +  API Gateway Origin (/api/*)</text>

  <!-- Arrow: CF -> S3 Static (diagonal left) -->
  <line x1="350" y1="214" x2="200" y2="268" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="254" y="238" class="arrow-label">Static</text>

  <!-- Arrow: CF -> API Gateway (diagonal right) -->
  <line x1="600" y1="214" x2="660" y2="268" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="644" y="238" class="arrow-label">/api/*</text>

  <!-- ==================== ROW 3: API + HOSTING ==================== -->
  <text x="44" y="290" class="section-label">API</text>

  <!-- S3 Static Hosting -->
  <rect x="70" y="272" width="240" height="50" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="272" width="240" height="4" rx="10" fill="#f59e0b"/>
  <rect x="84" y="288" width="24" height="16" rx="4" fill="#f59e0b"/>
  <text x="96" y="299" text-anchor="middle" class="badge">S3</text>
  <text x="200" y="298" text-anchor="middle" class="box-label">S3 Static Hosting</text>
  <text x="200" y="314" text-anchor="middle" class="box-desc">SPA Bundle (HTML / JS / CSS)</text>

  <!-- API Gateway -->
  <rect x="490" y="272" width="360" height="50" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="490" y="272" width="360" height="4" rx="10" fill="#f59e0b"/>
  <rect x="504" y="288" width="30" height="16" rx="4" fill="#f59e0b"/>
  <text x="519" y="299" text-anchor="middle" class="badge">API</text>
  <text x="680" y="298" text-anchor="middle" class="box-label">Amazon API Gateway</text>
  <text x="680" y="314" text-anchor="middle" class="box-desc">REST API  +  Rate Limiting  +  Cognito Authorizer</text>

  <!-- Cognito (attached to API GW right) -->
  <rect x="770" y="334" width="138" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="839" y="352" text-anchor="middle" class="box-label" style="font-size:11px">Amazon Cognito</text>
  <text x="839" y="366" text-anchor="middle" class="box-desc">User Pool + OAuth</text>
  <!-- Connector line: API GW bottom -> Cognito top -->
  <line x1="839" y1="322" x2="839" y2="334" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- Arrow: API GW -> Lambda API (straight down) -->
  <line x1="590" y1="322" x2="590" y2="394" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: API GW -> Lambda Agent (straight down) -->
  <line x1="760" y1="322" x2="760" y2="394" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== ROW 4: COMPUTE ==================== -->
  <text x="44" y="418" class="section-label">COMPUTE</text>

  <!-- Lambda: API -->
  <rect x="490" y="398" width="190" height="56" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="490" y="398" width="190" height="4" rx="10" fill="#10b981"/>
  <rect x="504" y="414" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="512" y="425" text-anchor="middle" class="badge" style="font-size:8px">fn</text>
  <text x="595" y="426" text-anchor="middle" class="box-label">Lambda: API</text>
  <text x="595" y="442" text-anchor="middle" class="box-desc">CRUD Operations</text>

  <!-- Lambda: Agent -->
  <rect x="700" y="398" width="190" height="56" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="398" width="190" height="4" rx="10" fill="#10b981"/>
  <rect x="714" y="414" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="722" y="425" text-anchor="middle" class="badge" style="font-size:8px">fn</text>
  <text x="805" y="426" text-anchor="middle" class="box-label">Lambda: Agent</text>
  <text x="805" y="442" text-anchor="middle" class="box-desc">Bedrock Agent + SSE Stream</text>

  <!-- Arrow: Lambda API -> DynamoDB (down-left, clean path) -->
  <path d="M 540,454 L 540,478 L 200,478 L 200,510" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow: Lambda API -> S3 Storage (down-left, clean path) -->
  <path d="M 600,454 L 600,490 L 420,490 L 420,510" stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrow: Lambda Agent -> Bedrock (straight down) -->
  <line x1="795" y1="454" x2="795" y2="510" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="812" y="486" class="arrow-label" style="fill:#3b82f6">InvokeAgent</text>

  <!-- ==================== ROW 5: DATA + AI ==================== -->
  <text x="44" y="530" class="section-label">DATA + AI</text>

  <!-- DynamoDB -->
  <rect x="80" y="514" width="230" height="56" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="514" width="230" height="4" rx="10" fill="#f59e0b"/>
  <rect x="94" y="530" width="32" height="16" rx="4" fill="#f59e0b"/>
  <text x="110" y="541" text-anchor="middle" class="badge">DDB</text>
  <text x="205" y="542" text-anchor="middle" class="box-label">Amazon DynamoDB</text>
  <text x="205" y="558" text-anchor="middle" class="box-desc">Analysis History  +  User Data</text>

  <!-- S3 Storage -->
  <rect x="330" y="514" width="200" height="56" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="330" y="514" width="200" height="4" rx="10" fill="#f59e0b"/>
  <rect x="344" y="530" width="24" height="16" rx="4" fill="#f59e0b"/>
  <text x="356" y="541" text-anchor="middle" class="badge">S3</text>
  <text x="440" y="542" text-anchor="middle" class="box-label">Amazon S3</text>
  <text x="440" y="558" text-anchor="middle" class="box-desc">Screenshots  +  Reports</text>

  <!-- Bedrock Agent (tall box) -->
  <rect x="640" y="514" width="270" height="156" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="514" width="270" height="4" rx="10" fill="#3b82f6"/>
  <rect x="656" y="530" width="24" height="16" rx="4" fill="#3b82f6"/>
  <text x="668" y="541" text-anchor="middle" class="badge">AI</text>
  <text x="785" y="542" text-anchor="middle" class="box-label">Amazon Bedrock</text>
  <text x="785" y="558" text-anchor="middle" class="box-desc">Nova 2 Lite  —  Multimodal Agent</text>

  <!-- Agent Tools -->
  <rect x="660" y="570" width="230" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="775" y="586" text-anchor="middle" class="tool-text">1. UI Visual Analysis</text>

  <rect x="660" y="598" width="230" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="775" y="614" text-anchor="middle" class="tool-text">2. Code Structure Analysis</text>

  <rect x="660" y="626" width="230" height="24" rx="6" fill="#c7d2fe" stroke="#818cf8" stroke-width="1"/>
  <text x="775" y="642" text-anchor="middle" class="tool-accent">3. Cross-Modal Reasoning</text>

  <rect x="660" y="654" width="230" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="775" y="670" text-anchor="middle" class="tool-text">4. Report Generation</text>

  <!-- ==================== OPS (subtle, bottom-left) ==================== -->
  <!-- CloudWatch -->
  <rect x="80" y="600" width="140" height="42" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="150" y="620" text-anchor="middle" class="box-label" style="font-size:11px">CloudWatch</text>
  <text x="150" y="634" text-anchor="middle" class="box-desc">Logs + Metrics + Alarms</text>

  <!-- Subtle dotted line: CloudWatch observes all -->
  <path d="M 220,618 L 470,450" stroke="#cbd5e1" stroke-width="0.8" fill="none" stroke-dasharray="3,4"/>
  <path d="M 220,622 L 680,450" stroke="#cbd5e1" stroke-width="0.8" fill="none" stroke-dasharray="3,4"/>

  <!-- ==================== FOOTER BADGES ==================== -->
  <rect x="70" y="700" width="200" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="170" y="718" text-anchor="middle" class="box-desc" style="font-weight:600;">AWS CDK v2 (TypeScript) — IaC</text>

  <rect x="290" y="700" width="230" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="405" y="718" text-anchor="middle" class="box-desc" style="font-weight:600;">GitHub Actions (OIDC) — CI/CD</text>

  <rect x="710" y="700" width="200" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="810" y="718" text-anchor="middle" class="box-desc" style="font-weight:600; fill:#15803d;">MVP Cost: ~$12/month</text>
</svg>